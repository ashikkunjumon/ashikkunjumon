name: Generate Contribution Snake

on:
  schedule:
    # Every six hours, not daily. The snake is a snapshot of the contribution
    # graph at the moment it runs, so a single 00:00 UTC build meant a day's
    # commits were invisible until the following midnight — work pushed at
    # 17:00 UTC waited sixteen hours to appear. Four builds a day bounds that
    # lag to six.
    #
    # 07:00 IST, 13:00, 19:00 and 01:00, so the day's work is picked up the
    # same evening rather than the next morning.
    #
    # This repository is public, so its Actions minutes are unmetered — unlike
    # the private ones, where a second scheduled run is a real cost.
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Build the snake animation from this repo owner's contribution graph
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Publish to the `output` branch, served from raw.githubusercontent.com
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
